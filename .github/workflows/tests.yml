name: Test Suite

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: python -m pip install poetry==1.8.3

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Check package metadata
        run: poetry check --lock

      - name: Compile Python files
        run: poetry run python -m compileall testrium tests

      - name: Run test suite
        run: poetry run pytest -q

      - name: Run CLI smoke scenario
        run: |
          cd tests
          ../.venv/bin/python -m testrium.core run
