name: Publish Python Package

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: python -m pip install poetry==1.8.3

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Check package metadata
        run: poetry check --lock

      - name: Run test suite
        run: poetry run pytest -q

      - name: Build package
        run: poetry build

      - name: Check PyPI token
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$POETRY_PYPI_TOKEN_PYPI" ]; then
            echo "PYPI_API_TOKEN secret is required to publish to PyPI."
            exit 1
          fi

      - name: Publish package
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: poetry publish --no-interaction --username __token__ --password "$POETRY_PYPI_TOKEN_PYPI"
